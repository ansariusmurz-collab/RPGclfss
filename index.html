<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120b07">
<title>Уютная RPG Комната — Онлайн</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #120b07;
    color: white;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
    position: fixed;
    inset: 0;
    overscroll-behavior: none;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
    touch-action: manipulation;
}

button:focus-visible, input:focus-visible {
    outline: 2px solid #06d6a0;
    outline-offset: 3px;
}

#start-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow-y: auto;
    background: radial-gradient(circle at center, #342442, #0c0812 75%);
}

.start-card {
    width: 100%;
    max-width: 370px;
    padding: 26px 24px;
    border: 1px solid #6c507f;
    border-radius: 22px;
    background: rgba(35, 27, 46, .96);
    box-shadow: 0 15px 50px #0008;
    text-align: center;
}

.start-card h1 {
    margin: 0 0 8px;
    color: #ffd166;
    font-size: 24px;
}

.start-card p {
    margin: 0 0 22px;
    color: #c3b9cf;
    font-size: 13px;
    line-height: 1.5;
}

.input-group {
    margin-bottom: 19px;
    text-align: left;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    color: #d1c4e9;
    font-size: 13px;
    font-weight: 600;
}

.input-group input {
    width: 100%;
    min-height: 46px;
    padding: 12px;
    border: 1px solid #5a4270;
    border-radius: 10px;
    background: #15101e;
    color: white;
    font-size: 16px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
}

.color-picker {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.color-btn {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border: 3px solid transparent;
    border-radius: 50%;
    box-shadow: 0 3px 8px #0004;
}

.color-btn.selected {
    border-color: white;
    box-shadow: 0 0 12px #ffffff70;
    transform: scale(1.1);
}

.btn-start {
    width: 100%;
    min-height: 49px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #06d6a0, #118ab2);
    color: white;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 5px 20px #06d6a033;
}

#game-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #120b07;
}

#canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

.top-bar {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
}

.top-bar-left, .top-bar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
}

.icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border: 1px solid #ffffff35;
    border-radius: 50%;
    background: #15101edb;
    color: white;
    font-size: 17px;
    box-shadow: 0 4px 12px #0004;
    touch-action: manipulation;
}

.icon-btn.active {
    background: #06d6a0;
    color: #10251e;
}

.icon-btn:disabled {
    opacity: .5;
}

.room-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 40px;
    padding: 8px 12px;
    border: 1px solid #ffffff35;
    border-radius: 22px;
    background: #15101edb;
    font-size: 12px;
    white-space: nowrap;
}

#room-status {
    position: absolute;
    top: 64px;
    left: 50%;
    z-index: 15;
    max-width: 75%;
    padding: 6px 12px;
    border-radius: 12px;
    background: #15101ec9;
    color: #d7d0df;
    font-size: 11px;
    text-align: center;
    transform: translateX(-50%);
    pointer-events: none;
}

#chat-overlay {
    position: absolute;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 30;
    display: flex;
    flex-direction: column;
    width: min(320px, calc(100% - 24px));
    height: min(270px, 55%);
    overflow: hidden;
    border: 1px solid #ffffff35;
    border-radius: 16px;
    background: #15101eef;
    box-shadow: 0 10px 30px #0006;
    backdrop-filter: blur(10px);
    transition: opacity .18s, transform .18s;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
}

#chat-overlay.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}

.chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 11px 14px;
    border-bottom: 1px solid #ffffff18;
    font-size: 13px;
    font-weight: bold;
}

#close-chat-btn {
    padding: 8px;
    border: 0;
    background: transparent;
    color: white;
    font-size: 16px;
}

.chat-messages {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    padding: 10px;
    font-size: 12px;
    overscroll-behavior: contain;
    user-select: text;
    -webkit-user-select: text;
}

.chat-msg {
    padding: 7px 9px;
    border-radius: 8px;
    background: #ffffff0c;
    overflow-wrap: anywhere;
    line-height: 1.4;
}

.chat-msg .author {
    margin-right: 4px;
    color: #ffd166;
    font-weight: bold;
}

.chat-input-area {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    padding: 8px;
    border-top: 1px solid #ffffff18;
}

.chat-input-area input {
    min-width: 0;
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ffffff22;
    border-radius: 20px;
    background: #0005;
    color: white;
    font-size: 14px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
}

.chat-send-btn {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border: 0;
    border-radius: 50%;
    background: #06d6a0;
    color: #10251e;
}

#joystick-zone {
    position: absolute;
    right: max(22px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    z-index: 10;
    display: none;
    width: 116px;
    height: 116px;
    border-radius: 50%;
    touch-action: none;
}

.joystick-base {
    position: relative;
    width: 100%;
    height: 100%;
    border: 2px solid #ffffff35;
    border-radius: 50%;
    background: #ffffff12;
    backdrop-filter: blur(3px);
}

.joystick-stick {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 48px;
    height: 48px;
    border: 1px solid #ffffff50;
    border-radius: 50%;
    background: #ffffff65;
    box-shadow: 0 3px 12px #0005;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#landscape-hint {
    display: none;
}

#game-error {
    position: absolute;
    left: 50%;
    bottom: 12px;
    z-index: 90;
    display: none;
    max-width: 90%;
    padding: 10px 14px;
    border: 1px solid #ff8b8b66;
    border-radius: 10px;
    background: #3a1010ee;
    color: white;
    font-size: 12px;
    transform: translateX(-50%);
}

@media (pointer: coarse) {
    #joystick-zone {
        display: block;
    }

    .icon-btn {
        width: 42px;
        height: 42px;
    }
}

@media (max-height: 450px) {
    .top-bar {
        top: max(5px, env(safe-area-inset-top));
    }

    .icon-btn {
        width: 36px;
        height: 36px;
        font-size: 15px;
    }

    .room-badge {
        min-height: 34px;
        padding: 6px 9px;
    }

    #room-status {
        top: 45px;
    }

    #chat-overlay {
        height: 48%;
        bottom: 8px;
    }

    #joystick-zone {
        width: 90px;
        height: 90px;
        right: 16px;
        bottom: 12px;
    }

    .joystick-stick {
        width: 40px;
        height: 40px;
    }
}
</style>
</head>

<body>

<div id="start-screen">
    <div class="start-card">
        <h1>Уютная RPG Комната</h1>
        <p>Создай персонажа и заходи в гости!</p>

        <div class="input-group">
            <label for="player-name">Ваше имя</label>
            <input id="player-name" type="text"
                   maxlength="12" value="Гость"
                   placeholder="Введите имя..." autocomplete="nickname">
        </div>

        <div class="input-group">
            <label>Цвет персонажа</label>
            <div class="color-picker">
                <button type="button" class="color-btn selected"
                        data-color="#ff4757" style="background:#ff4757"
                        aria-label="Красный"></button>
                <button type="button" class="color-btn"
                        data-color="#2ed573" style="background:#2ed573"
                        aria-label="Зелёный"></button>
                <button type="button" class="color-btn"
                        data-color="#1e90ff" style="background:#1e90ff"
                        aria-label="Синий"></button>
                <button type="button" class="color-btn"
                        data-color="#ffa502" style="background:#ffa502"
                        aria-label="Оранжевый"></button>
                <button type="button" class="color-btn"
                        data-color="#9b59b6" style="background:#9b59b6"
                        aria-label="Фиолетовый"></button>
            </div>
        </div>

        <button type="button" class="btn-start" id="start-btn">
            Войти в комнату
        </button>
    </div>
</div>

<div id="game-container" hidden>
    <canvas id="canvas"></canvas>

    <div class="top-bar">
        <div class="top-bar-left">
            <button type="button" class="icon-btn" id="toggle-chat-btn"
                    title="Открыть чат" aria-label="Открыть чат">
                <i class="fas fa-comment"></i>
            </button>

            <button type="button" class="icon-btn" id="toggle-mic-btn"
                    title="Включить микрофон" aria-label="Включить микрофон">
                <i class="fas fa-microphone-slash"></i>
            </button>
        </div>

        <div class="top-bar-right">
            <div class="room-badge">
                <i class="fas fa-users" style="color:#06d6a0"></i>
                <span id="player-count">1</span>
            </div>

            <button type="button" class="icon-btn" id="copy-link-btn"
                    title="Скопировать ссылку" aria-label="Скопировать ссылку">
                <i class="fas fa-link"></i>
            </button>
        </div>
    </div>

    <div id="room-status">Подготовка комнаты...</div>

    <div id="chat-overlay">
        <div class="chat-header">
            <span>Чат комнаты</span>
            <button type="button" id="close-chat-btn"
                    aria-label="Закрыть чат">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="chat-messages" id="chat-messages"
             aria-live="polite"></div>

        <div class="chat-input-area">
            <input id="chat-input" type="text"
                   placeholder="Напишите сообщение..."
                   maxlength="60" autocomplete="off">
            <button type="button" class="chat-send-btn" id="chat-send-btn"
                    aria-label="Отправить сообщение">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div id="joystick-zone" aria-label="Управление персонажем">
        <div class="joystick-base">
            <div class="joystick-stick" id="joystick-stick"></div>
        </div>
    </div>

    <div id="game-error"></div>
</div>

<script>
'use strict';

// ==========================================
// НАСТРОЙКИ И ПЕРЕМЕННЫЕ
// ==========================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const gameContainer = document.getElementById('game-container');
const roomStatus = document.getElementById('room-status');
const errorBox = document.getElementById('game-error');

const ROOM_WIDTH = 800;
const ROOM_HEIGHT = 600;

const keys = Object.create(null);
const remotePlayers = Object.create(null);
const connections = Object.create(null);
const activeCalls = new Set();
const activeAudioElements = new Set();

let peer = null;
let isHost = false;
let started = false;
let networkReady = false;
let networkStarting = false;
let micEnabled = false;
let localAudioStream = null;
let selectedColor = '#ff4757';
let touchTarget = null;
let animationFrame = 0;
let lastNetworkUpdate = 0;

const joystickZone = document.getElementById('joystick-zone');
const joystickStick = document.getElementById('joystick-stick');

let joystickPointerId = null;
let joystickVector = { x: 0, y: 0 };

let roomCode = '';

const localPlayer = {
    id: '',
    name: 'Гость',
    color: selectedColor,
    x: ROOM_WIDTH / 2,
    y: ROOM_HEIGHT / 2 + 50,
    radius: 18,
    speed: 3.5,
    chatBubble: '',
    chatBubbleUntil: 0,
    isSpeaking: false
};

// ==========================================
// ИЗОБРАЖЕНИЯ МЕБЕЛИ
// ==========================================

const images = {
    shkaf: new Image(),
    divan: new Image(),
    kover: new Image()
};

const loadedImages = {
    shkaf: false,
    divan: false,
    kover: false
};

for (const name of Object.keys(images)) {
    images[name].onload = () => {
        loadedImages[name] = true;
    };

    images[name].onerror = () => {
        loadedImages[name] = false;
        console.warn('Не удалось загрузить изображение:', name + '.png');
    };

    images[name].src = name + '.png';
}

// ==========================================
// МЕБЕЛЬ
// ==========================================

const furniture = [
    {
        type: 'kover',
        x: 400, y: 300, w: 220, h: 150,
        rotation: 0, solid: false
    },
    {
        type: 'divan',
        x: 400, y: 180, w: 140, h: 60,
        rotation: 0, solid: true
    },
    {
        type: 'divan',
        x: 400, y: 420, w: 140, h: 60,
        rotation: Math.PI, solid: true
    },
    {
        type: 'shkaf',
        x: 90, y: 90, w: 70, h: 100,
        rotation: 0, solid: true
    },
    {
        type: 'shkaf',
        x: 710, y: 90, w: 70, h: 100,
        rotation: 0, solid: true
    },
    {
        type: 'shkaf',
        x: 90, y: 510, w: 70, h: 100,
        rotation: Math.PI, solid: true
    },
    {
        type: 'shkaf',
        x: 710, y: 510, w: 70, h: 100,
        rotation: Math.PI, solid: true
    }
];

// ==========================================
// CANVAS: АДАПТАЦИЯ ПОД ЭКРАН
// ==========================================

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => {
    setTimeout(resizeCanvas, 200);
});

// Масштаб и смещение для логических координат комнаты.
function getRoomTransform() {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    const scale = Math.min(
        width / ROOM_WIDTH,
        height / ROOM_HEIGHT
    );

    return {
        scale,
        x: (width - ROOM_WIDTH * scale) / 2,
        y: (height - ROOM_HEIGHT * scale) / 2
    };
}

function screenToRoom(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const transform = getRoomTransform();

    return {
        x: (clientX - rect.left - transform.x) / transform.scale,
        y: (clientY - rect.top - transform.y) / transform.scale
    };
}

// ==========================================
// УПРАВЛЕНИЕ С КЛАВИАТУРЫ
// ==========================================

window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLInputElement) return;

    if ([
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'Space'
    ].includes(event.code)) {
        event.preventDefault();
    }

    keys[event.code] = true;
});

window.addEventListener('keyup', event => {
    keys[event.code] = false;
});

window.addEventListener('blur', () => {
    for (const key of Object.keys(keys)) {
        keys[key] = false;
    }

    joystickVector = { x: 0, y: 0 };
    joystickPointerId = null;
    joystickStick.style.transform = 'translate(-50%, -50%)';
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        for (const key of Object.keys(keys)) {
            keys[key] = false;
        }
    }
});

// ==========================================
// СЕНСОРНЫЙ ДЖОЙСТИК
// Pointer Events поддерживают Android и iPhone.
// ==========================================

joystickZone.addEventListener('pointerdown', event => {
    if (!started || joystickPointerId !== null) return;

    event.preventDefault();

    joystickPointerId = event.pointerId;

    try {
        joystickZone.setPointerCapture(event.pointerId);
    } catch (_) {}

    updateJoystick(event);
});

joystickZone.addEventListener('pointermove', event => {
    if (event.pointerId !== joystickPointerId) return;

    event.preventDefault();
    updateJoystick(event);
});

function stopJoystick(event) {
    if (
        event &&
        joystickPointerId !== null &&
        event.pointerId !== joystickPointerId
    ) {
        return;
    }

    joystickPointerId = null;
    joystickVector = { x: 0, y: 0 };
    joystickStick.style.transform = 'translate(-50%, -50%)';
}

joystickZone.addEventListener('pointerup', stopJoystick);
joystickZone.addEventListener('pointercancel', stopJoystick);
joystickZone.addEventListener('lostpointercapture', stopJoystick);

function updateJoystick(event) {
    const rect = joystickZone.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = event.clientX - centerX;
    let dy = event.clientY - centerY;

    const maxDist = rect.width / 2 - 5;
    const distance = Math.hypot(dx, dy);

    if (distance > maxDist) {
        dx = dx / distance * maxDist;
        dy = dy / distance * maxDist;
    }

    joystickVector = {
        x: dx / maxDist,
        y: dy / maxDist
    };

    joystickStick.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

// ==========================================
// НАЖАТИЕ ПО КОМНАТЕ ДЛЯ ПЕРЕМЕЩЕНИЯ
// ==========================================

canvas.addEventListener('pointerdown', event => {
    if (!started || event.button !== 0) return;

    const point = screenToRoom(event.clientX, event.clientY);

    if (
        point.x < 0 || point.x > ROOM_WIDTH ||
        point.y < 0 || point.y > ROOM_HEIGHT
    ) {
        return;
    }

    touchTarget = {
        x: point.x,
        y: point.y
    };
});

// ==========================================
// СТОЛКНОВЕНИЯ И ДВИЖЕНИЕ
// ==========================================

function checkCollisions(x, y) {
    for (const item of furniture) {
        if (!item.solid) continue;

        const halfW = item.w / 2;
        const halfH = item.h / 2;

        if (
            x + localPlayer.radius > item.x - halfW &&
            x - localPlayer.radius < item.x + halfW &&
            y + localPlayer.radius > item.y - halfH &&
            y - localPlayer.radius < item.y + halfH
        ) {
            return true;
        }
    }

    return false;
}

function tryMove(vx, vy) {
    const oldX = localPlayer.x;
    const oldY = localPlayer.y;

    const nextX = localPlayer.x + vx;

    if (!checkCollisions(nextX, localPlayer.y)) {
        localPlayer.x = nextX;
    }

    const nextY = localPlayer.y + vy;

    if (!checkCollisions(localPlayer.x, nextY)) {
        localPlayer.y = nextY;
    }

    const padding = 45 + localPlayer.radius;

    localPlayer.x = Math.max(
        padding,
        Math.min(ROOM_WIDTH - padding, localPlayer.x)
    );

    localPlayer.y = Math.max(
        padding,
        Math.min(ROOM_HEIGHT - padding, localPlayer.y)
    );

    if (oldX !== localPlayer.x || oldY !== localPlayer.y) {
        broadcast({
            type: 'move',
            x: localPlayer.x,
            y: localPlayer.y
        });
    }
}

function movePlayer() {
    if (!started) return;

    let dx = 0;
    let dy = 0;

    if (keys.KeyW || keys.ArrowUp) dy -= 1;
    if (keys.KeyS || keys.ArrowDown) dy += 1;
    if (keys.KeyA || keys.ArrowLeft) dx -= 1;
    if (keys.KeyD || keys.ArrowRight) dx += 1;

    if (joystickPointerId !== null) {
        dx = joystickVector.x;
        dy = joystickVector.y;
        touchTarget = null;
    }

    if (dx !== 0 || dy !== 0) {
        touchTarget = null;

        const length = Math.hypot(dx, dy);

        if (length > 1) {
            dx /= length;
            dy /= length;
        }

        tryMove(
            dx * localPlayer.speed,
            dy * localPlayer.speed
        );

    } else if (touchTarget) {
        const tx = touchTarget.x - localPlayer.x;
        const ty = touchTarget.y - localPlayer.y;
        const distance = Math.hypot(tx, ty);

        if (distance <= localPlayer.speed) {
            tryMove(tx, ty);
            touchTarget = null;
        } else {
            tryMove(
                tx / distance * localPlayer.speed,
                ty / distance * localPlayer.speed
            );
        }
    }
}

// ==========================================
// ОТРИСОВКА КОМНАТЫ
// ==========================================

function drawRoom() {
    ctx.fillStyle = '#120b07';
    ctx.fillRect(0, 0, ROOM_WIDTH, ROOM_HEIGHT);

    ctx.fillStyle = '#2e1d13';
    ctx.fillRect(35, 35, ROOM_WIDTH - 70, ROOM_HEIGHT - 70);

    // Деревянный пол.
    ctx.strokeStyle = '#1a0f0a';
    ctx.lineWidth = 2;

    for (let x = 50; x < ROOM_WIDTH - 50; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 35);
        ctx.lineTo(x, ROOM_HEIGHT - 35);
        ctx.stroke();
    }

    // Границы комнаты.
    ctx.strokeStyle = '#70452c';
    ctx.lineWidth = 5;
    ctx.strokeRect(35, 35, ROOM_WIDTH - 70, ROOM_HEIGHT - 70);

    // Мебель.
    for (const item of furniture) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rotation);

        if (loadedImages[item.type]) {
            ctx.drawImage(
                images[item.type],
                -item.w / 2,
                -item.h / 2,
                item.w,
                item.h
            );
        } else {
            ctx.fillStyle =
                item.type === 'kover' ? '#8a2be2' :
                item.type === 'divan' ? '#c0392b' :
                '#d35400';

            ctx.fillRect(
                -item.w / 2,
                -item.h / 2,
                item.w,
                item.h
            );

            ctx.strokeStyle = '#ffffff35';
            ctx.lineWidth = 2;

            ctx.strokeRect(
                -item.w / 2,
                -item.h / 2,
                item.w,
                item.h
            );
        }

        ctx.restore();
    }
}

function drawPlayer(player) {
    if (!player) return;

    ctx.save();
    ctx.translate(player.x, player.y);

    // Тень.
    ctx.fillStyle = '#0006';
    ctx.beginPath();
    ctx.ellipse(
        0, player.radius - 2,
        player.radius, player.radius * 0.5,
        0, 0, Math.PI * 2
    );
    ctx.fill();

    // Волны голоса.
    if (player.isSpeaking) {
        ctx.strokeStyle = '#06d6a0';
        ctx.lineWidth = 2;

        const wave = player.radius + 7 +
            Math.sin(Date.now() / 100) * 3;

        ctx.beginPath();
        ctx.arc(0, 0, wave, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Круглый персонаж.
    const gradient = ctx.createRadialGradient(
        -5, -6, 2, 0, 0, player.radius
    );

    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(.28, player.color);
    gradient.addColorStop(1, '#19131c');

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Имя.
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 5;
    ctx.fillStyle = '#ffcc80';

    ctx.fillText(
        player.name || 'Гость',
        0,
        -player.radius - 9
    );

    // Облачко сообщения.
    if (
        player.chatBubble &&
        player.chatBubbleUntil > Date.now()
    ) {
        const text = player.chatBubble.slice(0, 60);

        ctx.font = '11px sans-serif';

        const maxWidth = 160;
        const textWidth = Math.min(
            ctx.measureText(text).width,
            maxWidth
        );

        const bubbleWidth = textWidth + 18;
        const bubbleHeight = 25;
        const bubbleY = -player.radius - 39;

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fffffff2';

        ctx.beginPath();
        ctx.roundRect(
            -bubbleWidth / 2,
            bubbleY,
            bubbleWidth,
            bubbleHeight,
            9
        );
        ctx.fill();

        ctx.fillStyle = '#21182a';
        ctx.fillText(
            text,
            0,
            bubbleY + 16,
            maxWidth
        );
    }

    ctx.restore();
}

function render() {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    ctx.clearRect(0, 0, width, height);

    ctx.fillStyle = '#120b07';
    ctx.fillRect(0, 0, width, height);

    const transform = getRoomTransform();

    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.scale, transform.scale);

    drawRoom();

    for (const player of Object.values(remotePlayers)) {
        drawPlayer(player);
    }

    drawPlayer(localPlayer);

    ctx.restore();
}

function gameLoop() {
    if (!started) return;

    movePlayer();
    render();

    animationFrame = requestAnimationFrame(gameLoop);
}

// ==========================================
// ВЫБОР ЦВЕТА
// ==========================================

document.querySelectorAll('.color-btn').forEach(button => {
    button.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(item => {
            item.classList.remove('selected');
        });

        button.classList.add('selected');

        selectedColor = button.dataset.color;
        localPlayer.color = selectedColor;

        broadcast({
            type: 'profile',
            name: localPlayer.name,
            color: localPlayer.color
        });
    });
});

// ==========================================
// СТАРТ ИГРЫ
// ==========================================

document.getElementById('start-btn').addEventListener('click', async () => {
    if (started) return;

    localPlayer.name =
        document.getElementById('player-name').value.trim().slice(0, 12)
        || 'Гость';

    localPlayer.color = selectedColor;

    started = true;

    startScreen.style.display = 'none';
    gameContainer.hidden = false;

    resizeCanvas();
    render();

    animationFrame = requestAnimationFrame(gameLoop);

    // Fullscreen доступен не во всех браузерах iPhone.
    try {
        const root = document.documentElement;

        if (root.requestFullscreen) {
            await root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        }
    } catch (error) {
        console.log('Полноэкранный режим недоступен:', error);
    }

    // Блокировка ориентации поддерживается не всеми устройствами.
    try {
        if (screen.orientation?.lock) {
            await screen.orientation.lock('landscape');
        }
    } catch (error) {
        console.log('Ориентация остаётся системной:', error);
    }

    initPeerNetwork();
});

// ==========================================
// ЧАТ
// ==========================================

const chatOverlay = document.getElementById('chat-overlay');
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');

document.getElementById('toggle-chat-btn').addEventListener('click', () => {
    chatOverlay.classList.toggle('visible');
});

document.getElementById('close-chat-btn').addEventListener('click', () => {
    chatOverlay.classList.remove('visible');
});

function addChatMessage(author, text) {
    const row = document.createElement('div');
    row.className = 'chat-msg';

    const name = document.createElement('span');
    name.className = 'author';
    name.textContent = (author || 'Гость') + ':';

    const message = document.createElement('span');
    message.textContent = text;

    row.append(name, message);
    chatMessages.appendChild(row);

    // Не храним бесконечное количество сообщений.
    while (chatMessages.children.length > 100) {
        chatMessages.firstElementChild.remove();
    }

    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showSpeechBubble(player, text) {
    player.chatBubble = String(text).slice(0, 60);
    player.chatBubbleUntil = Date.now() + 4000;
}

function sendChatMessage() {
    const text = chatInput.value.trim().slice(0, 60);

    if (!text) return;

    addChatMessage(localPlayer.name, text);
    showSpeechBubble(localPlayer, text);

    broadcast({
        type: 'chat',
        text
    });

    chatInput.value = '';
}

document.getElementById('chat-send-btn')
    .addEventListener('click', sendChatMessage);

chatInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        sendChatMessage();
    }
});

// ==========================================
// СЕТЬ PEERJS
// ==========================================

function setRoomStatus(text) {
    roomStatus.textContent = text;
}

function showError(text) {
    errorBox.textContent = text;
    errorBox.style.display = 'block';
}

function updatePlayerCount() {
    document.getElementById('player-count').textContent =
        String(Object.keys(remotePlayers).length + 1);
}

function initPeerNetwork() {
    if (networkStarting || networkReady) return;

    networkStarting = true;

    if (typeof Peer === 'undefined') {
        setRoomStatus('Ошибка загрузки PeerJS');
        showError('Проверь подключение к интернету и перезагрузи страницу.');
        networkStarting = false;
        return;
    }

    // Код комнаты хранится в адресе после #.
    roomCode = window.location.hash.slice(1)
        .replace(/[^a-zA-Z0-9]/g, '')
        .slice(0, 20);

    if (!roomCode) {
        roomCode = 'r' + Math.floor(1000 + Math.random() * 9000);
        history.replaceState(
            null,
            '',
            window.location.pathname + window.location.search + '#' + roomCode
        );
    }

    const hostId = 'cozyroom' + roomCode;

    setRoomStatus('Подключение к онлайн-комнате...');

    // Сначала пытаемся создать комнату с постоянным ID.
    // Если этот ID уже занят, становимся гостем.
    const hostPeer = new Peer(hostId);

    let decided = false;

    hostPeer.on('open', id => {
        if (decided) return;
        decided = true;

        peer = hostPeer;
        localPlayer.id = id;
        isHost = true;
        networkReady = true;
        networkStarting = false;

        setRoomStatus('Комната создана • Код: ' + roomCode);
        console.log('Комната создана:', roomCode);
        updatePlayerCount();

        setupPeerEvents();
    });

    hostPeer.on('error', error => {
        if (decided) {
            console.error('PeerJS:', error);
            setRoomStatus('Ошибка соединения');
            return;
        }

        // Чаще всего ID уже используется хозяином комнаты.
        if (
            error.type === 'unavailable-id' ||
            error.type === 'server-error'
        ) {
            decided = true;

            try {
                hostPeer.destroy();
            } catch (_) {}

            becomeGuest(hostId);
        } else {
            decided = true;

            try {
                hostPeer.destroy();
            } catch (_) {}

            becomeGuest(hostId);
        }
    });
}

function becomeGuest(hostId) {
    setRoomStatus('Поиск хозяина комнаты...');

    peer = new Peer();

    peer.on('open', id => {
        localPlayer.id = id;
        isHost = false;
        networkReady = true;
        networkStarting = false;

        const conn = peer.connect(hostId, {
            reliable: true
        });

        setupConnection(conn);

        conn.on('open', () => {
            setRoomStatus('Подключено к комнате');
            conn.send({
                type: 'join',
                player: getPublicPlayer()
            });
        });

        conn.on('error', error => {
            console.error('Ошибка подключения к хозяину:', error);
            setRoomStatus('Не удалось подключиться к хозяину');
        });
    });

    setupPeerEvents();
}

function setupPeerEvents() {
    peer.on('connection', conn => {
        if (isHost) {
            setupConnection(conn);
        }
    });

    peer.on('call', call => {
        // Принимаем голосовой звонок.
        call.answer(localAudioStream || undefined);
        handleAudioCall(call);
    });

    peer.on('disconnected', () => {
        setRoomStatus('Связь с сервером потеряна. Переподключение...');
        try {
            peer.reconnect();
        } catch (error) {
            console.error(error);
        }
    });

    peer.on('error', error => {
        console.error('Ошибка сети:', error);
    });
}

function getPublicPlayer() {
    return {
        id: localPlayer.id,
        name: localPlayer.name,
        color: localPlayer.color,
        x: localPlayer.x,
        y: localPlayer.y,
        radius: localPlayer.radius,
        isSpeaking: false
    };
}

function setupConnection(conn) {
    if (connections[conn.peer]) return;

    connections[conn.peer] = conn;

    conn.on('open', () => {
        if (isHost) {
            conn.send({
                type: 'welcome',
                players: Object.values(remotePlayers)
                    .map(player => ({ ...player }))
                    .concat([getPublicPlayer()])
            });
        }
    });

    conn.on('data', data => {
        if (!data || typeof data !== 'object') return;

        if (isHost) {
            if (data.type === 'join') {
                const player = data.player || {};

                remotePlayers[conn.peer] = {
                    id: conn.peer,
                    name: String(player.name || 'Гость').slice(0, 12),
                    color: /^#[0-9a-f]{6}$/i.test(player.color)
                        ? player.color : '#ff4757',
                    x: ROOM_WIDTH / 2,
                    y: ROOM_HEIGHT / 2 + 50,
                    radius: 18,
                    isSpeaking: false
                };

                // Сообщаем всем участникам о новом игроке.
                relay({
                    type: 'player-joined',
                    player: remotePlayers[conn.peer]
                }, conn.peer);

                conn.send({
                    type: 'welcome',
                    players: Object.values(remotePlayers)
                        .map(player => ({ ...player }))
                        .concat([getPublicPlayer()])
                });

                updatePlayerCount();
                return;
            }

            // Хозяин принимает сообщения гостей и рассылает остальным.
            processNetworkData(data, conn.peer);
            relay({
                type: 'player-data',
                id: conn.peer,
                data
            }, conn.peer);

        } else {
            if (data.type === 'welcome') {
                remotePlayers && Object.keys(remotePlayers).forEach(id => {
                    delete remotePlayers[id];
                });

                for (const player of data.players || []) {
                    if (player.id !== localPlayer.id) {
                        remotePlayers[player.id] = player;
                    }
                }

                updatePlayerCount();
                setRoomStatus('Вы в комнате • Код: ' + roomCode);
                return;
            }

            if (data.type === 'player-joined') {
                if (data.player && data.player.id !== localPlayer.id) {
                    remotePlayers[data.player.id] = data.player;
                    updatePlayerCount();
                }
                return;
            }

            if (data.type === 'player-left') {
                delete remotePlayers[data.id];
                updatePlayerCount();
                return;
            }

            if (data.type === 'player-data') {
                processNetworkData(data.data, data.id);
            }
        }
    });

    conn.on('close', () => {
        delete connections[conn.peer];

        if (remotePlayers[conn.peer]) {
            delete remotePlayers[conn.peer];

            if (isHost) {
                relay({
                    type: 'player-left',
                    id: conn.peer
                }, conn.peer);
            }

            updatePlayerCount();
        }
    });

    conn.on('error', error => {
        console.error('Соединение:', error);
    });
}

function processNetworkData(data, senderId) {
    if (!data || typeof data !== 'object') return;

    const player = remotePlayers[senderId];

    if (data.type === 'move' && player) {
        if (Number.isFinite(data.x) && Number.isFinite(data.y)) {
            player.x = Math.max(0, Math.min(ROOM_WIDTH, data.x));
            player.y = Math.max(0, Math.min(ROOM_HEIGHT, data.y));
        }
    }

    if (data.type === 'profile' && player) {
        player.name = String(data.name || 'Гость').slice(0, 12);

        if (/^#[0-9a-f]{6}$/i.test(data.color)) {
            player.color = data.color;
        }
    }

    if (data.type === 'chat' && player) {
        const text = String(data.text || '').slice(0, 60);

        if (text) {
            addChatMessage(player.name, text);
            showSpeechBubble(player, text);
        }
    }
}

function relay(data, exceptId) {
    for (const [id, conn] of Object.entries(connections)) {
        if (id === exceptId) continue;

        if (conn && conn.open) {
            try {
                conn.send(data);
            } catch (error) {
                console.error('Ошибка передачи данных:', error);
            }
        }
    }
}

function broadcast(data) {
    if (!networkReady || !peer) return;

    if (isHost) {
        // Хозяин передаёт обновления всем гостям.
        relay(data);
    } else {
        // Гость отправляет данные хозяину, который их ретранслирует.
        const hostConnection = Object.values(connections).find(
            conn => conn && conn.open
        );

        if (hostConnection) {
            try {
                hostConnection.send(data);
            } catch (error) {
                console.error(error);
            }
        }
    }
}

// ==========================================
// ГОЛОСОВОЙ ЧАТ
// ==========================================

const micButton = document.getElementById('toggle-mic-btn');

micButton.addEventListener('click', async () => {
    if (micEnabled) {
        micEnabled = false;

        if (localAudioStream) {
            localAudioStream.getAudioTracks().forEach(track => {
                track.stop();
            });
        }

        localAudioStream = null;

        for (const call of activeCalls) {
            try {
                call.close();
            } catch (_) {}
        }

        activeCalls.clear();

        localPlayer.isSpeaking = false;
        micButton.classList.remove('active');
        micButton.innerHTML = '<i class="fas fa-microphone-slash"></i>';
        micButton.title = 'Включить микрофон';

        broadcast({
            type: 'profile',
            name: localPlayer.name,
            color: localPlayer.color
        });

        return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
        alert(
            'Микрофон недоступен. Открой игру через HTTPS ' +
            'и разреши доступ к микрофону.'
        );
        return;
    }

    micButton.disabled = true;

    try {
        localAudioStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: false
        });

        micEnabled = true;
        micButton.classList.add('active');
        micButton.innerHTML = '<i class="fas fa-microphone"></i>';
        micButton.title = 'Выключить микрофон';

        // Открываем голосовые соединения с известными игроками.
        for (const playerId of Object.keys(remotePlayers)) {
            startAudioCall(playerId);
        }

        localAudioStream.getAudioTracks().forEach(track => {
            track.addEventListener('ended', () => {
                if (micEnabled) {
                    micEnabled = false;
                    localPlayer.isSpeaking = false;
                    micButton.classList.remove('active');
                    micButton.innerHTML =
                        '<i class="fas fa-microphone-slash"></i>';
                }
            });
        });

    } catch (error) {
        console.error('Микрофон:', error);

        alert(
            error.name === 'NotAllowedError'
                ? 'Ты запретил доступ к микрофону. Разреши его в настройках браузера.'
                : 'Не удалось включить микрофон. Проверь подключение и разрешения.'
        );

    } finally {
        micButton.disabled = false;
    }
});

function startAudioCall(playerId) {
    if (!peer || !localAudioStream || !micEnabled) return;
    if (playerId === localPlayer.id) return;

    const key = playerId;

    if (activeCalls.has(key)) return;

    try {
        const call = peer.call(playerId, localAudioStream);

        if (!call) return;

        activeCalls.add(key);
        handleAudioCall(call, key);

    } catch (error) {
        console.error('Не удалось начать голосовой звонок:', error);
    }
}

function handleAudioCall(call, key) {
    call.on('stream', stream => {
        let audio = document.createElement('audio');

        audio.autoplay = true;
        audio.playsInline = true;
        audio.srcObject = stream;

        // Не воспроизводим собственный звук повторно.
        audio.muted = false;

        document.body.appendChild(audio);
        activeAudioElements.add(audio);

        const playPromise = audio.play();

        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(error => {
                console.warn('Автовоспроизведение звука заблокировано:', error);
            });
        }

        stream.getAudioTracks().forEach(track => {
            track.addEventListener('ended', () => {
                audio.remove();
                activeAudioElements.delete(audio);
            });
        });
    });

    call.on('close', () => {
        if (key) activeCalls.delete(key);
    });

    call.on('error', error => {
        console.error('Голосовое соединение:', error);
        if (key) activeCalls.delete(key);
    });
}

// ==========================================
// КОПИРОВАНИЕ ССЫЛКИ
// ==========================================

document.getElementById('copy-link-btn').addEventListener('click', async () => {
    const url = window.location.href;

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(url);
        } else {
            const textArea = document.createElement('textarea');
            textArea.value = url;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            const success = document.execCommand('copy');
            textArea.remove();

            if (!success) throw new Error('Не удалось скопировать');
        }

        setRoomStatus('Ссылка скопирована!');
        alert('Ссылка скопирована! Отправь её другу.');

    } catch (error) {
        console.error(error);
        prompt('Скопируй ссылку на комнату:', url);
    }
});

// ==========================================
// ЗАВЕРШЕНИЕ
// ==========================================

window.addEventListener('beforeunload', () => {
    cancelAnimationFrame(animationFrame);

    if (localAudioStream) {
        localAudioStream.getTracks().forEach(track => track.stop());
    }

    if (peer) {
        try {
            peer.destroy();
        } catch (_) {}
    }
});

// Игра не запускает цикл до нажатия «Войти в комнату».
resizeCanvas();
render();
</script>
